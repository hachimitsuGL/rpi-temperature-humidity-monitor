name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # GPIO and sensor drivers require Raspberry Pi hardware; these tests
      # exercise the pure logic, GPIO callback mocks and Flask dashboard.
      - name: Install test dependencies
        run: python -m pip install 'Flask>=2.3,<4'
      - name: Check Python syntax
        run: python -m compileall -q run.py climate_monitor tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
