<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>温湿度モニター</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
    <h1>温湿度モニター</h1>
    <div class="grid">
        <div class="card">
            <div class="label">温度</div>
            <div class="value" id="temperature">--.-℃</div>
            <div class="status" id="temp-status">読み込み中...</div>
        </div>
        <div class="card">
            <div class="label">湿度</div>
            <div class="value" id="humidity">--.-%</div>
            <div class="status" id="hum-status">読み込み中...</div>
        </div>
    </div>

    <div class="card chart-card">
        <div class="chart-head">
            <div class="chart-title">温湿度の推移</div>
            <div class="chart-note">直近約30分 / 5秒ごと</div>
        </div>
        <div class="chart-wrap">
            <canvas id="history-chart"></canvas>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="legend-dot temp-dot"></span>温度（℃・左目盛）</div>
            <div class="legend-item"><span class="legend-dot hum-dot"></span>湿度（%・右目盛）</div>
        </div>
    </div>

    <div class="footer">
        快適範囲：<span id="comfort-range">温度 --～--℃ / 湿度 --～--%</span><br>
        最終更新：<span id="updated-at">--:--:--</span>
    </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
